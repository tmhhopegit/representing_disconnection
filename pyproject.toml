[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "disconnection"
version = "1.0.0"
description = "Lesion load vs structural disconnection for predicting post-stroke language: leak-free cross-validated comparisons"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "pandas", "scikit-learn>=1.2", "matplotlib", "joblib"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["disconnection"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
